[project]
site_name = "OMERO Annotate AI"
site_description = "Reproducible AI-assisted annotation of OMERO data, from image selection to training-ready datasets"
site_url = "https://leiden-cell-observatory.github.io/omero_annotate_ai/"
repo_url = "https://github.com/Leiden-Cell-Observatory/omero_annotate_ai"
repo_name = "Leiden-Cell-Observatory/omero_annotate_ai"
edit_uri = "edit/main/docs/"
copyright = "Leiden Cell Observatory · NL-BioImaging"

# Design notes and implementation plans live next to the docs but are not published.
exclude_docs = """
superpowers/
"""

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation" = "installation.md" },
    { "How it works" = "concepts.md" },
    { "Try it on public data" = "tutorials/public-data-idr.md" },
  ] },
  { "Guides" = [
    "tutorials/index.md",
    { "Annotate with micro-SAM" = "tutorials/microsam-annotation-pipeline.md" },
    { "Annotate with Cellpose" = "tutorials/cellpose-integration.md" },
    { "Resume or repeat a run" = "tutorials/resume-and-repeat.md" },
    { "Prepare training data" = "tutorials/training-data-prep.md" },
    { "Share via the BioImage Archive" = "tutorials/bioimage-archive-export.md" },
  ] },
  { "Reference" = [
    { "Configuration (YAML)" = "configuration.md" },
    { "Example notebooks" = "notebooks.md" },
    { "Troubleshooting" = "troubleshooting.md" },
  ] },
  { "API" = [
    "api/index.md",
    { "Configuration" = "api/config.md" },
    { "Pipeline" = "api/pipeline.md" },
    { "Widgets" = "api/widgets.md" },
    { "Training data" = "api/training.md" },
    { "OMERO helpers" = "api/omero.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "navigation.tracking",
  "navigation.footer",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "content.action.edit",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Leiden-Cell-Observatory/omero_annotate_ai"
name = "GitHub repository"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/omero-annotate-ai/"
name = "PyPI package"

# ---------------------------------------------------------------- Markdown

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
toc_depth = 3
[project.markdown_extensions."pymdownx.details"]
[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions."pymdownx.inlinehilite"]
[project.markdown_extensions."pymdownx.keys"]
[project.markdown_extensions."pymdownx.mark"]
[project.markdown_extensions."pymdownx.snippets"]
base_path = ["docs/includes"]
auto_append = ["abbreviations.md"]
[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true
[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true
[project.markdown_extensions."pymdownx.emoji"]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

# ---------------------------------------------------------------- API docs

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = false
show_root_heading = true
show_root_toc_entry = false
show_signature_annotations = true
separate_signature = true
show_symbol_type_heading = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
extensions = [{ griffe_pydantic = { schema = false } }]
