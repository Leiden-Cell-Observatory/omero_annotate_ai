[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omero-annotate-ai"
version = "0.4.0"
description = "OMERO integration for AI-powered image annotation and segmentation workflows"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [
    {name = "Maarten Paul", email = "m.w.paul@lacdr.leidenuniv.nl"},
]
maintainers = [
    {name = "Maarten Paul", email = "m.w.paul@lacdr.leidenuniv.nl"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Environment :: Console",
    "Environment :: Other Environment",
]
keywords = ["omero", "microscopy", "segmentation", "ai", "annotation", "sam", "micro-sam"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "imageio>=2.9.0",
    "dask>=2021.6.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "ezomero>=3.1.0",
    "opencv-python",
    "tifffile",
]

[project.optional-dependencies]
notebooks = [
    "ipywidgets>=7.6.0",
    "ipykernel",
    "pixi-kernel>=0.6.6,<0.7",
    "marimo>=0.19.2,<0.20",
    "keyring>=23.0.0",
]
microsam = [
    "micro-sam>=1.8",  # brings napari; pixi takes micro_sam from conda-forge instead
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "ruff>=0.17",
    "pyright>=1.1.414",
]
docs = [
    "zensical>=0.0.73",
    "mkdocstrings>=1.0.8",
    "mkdocstrings-python>=1.18",
    "griffe-pydantic>=1.1.7",
]
zarr = ["ome-zarr>=0.16"]
all = [
    "omero-annotate-ai[notebooks,microsam,zarr]",
]

[project.urls]
Homepage = "https://github.com/Leiden-Cell-Observatory/omero_annotate_ai"
Repository = "https://github.com/Leiden-Cell-Observatory/omero_annotate_ai.git"
Issues = "https://github.com/Leiden-Cell-Observatory/omero_annotate_ai/issues"
Documentation = "https://leiden-cell-observatory.github.io/omero_annotate_ai/"
Changelog = "https://github.com/Leiden-Cell-Observatory/omero_annotate_ai/releases"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omero_annotate_ai*"]

[tool.setuptools.package-data]
omero_annotate_ai = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "T20", "BLE", "PTH", "RET"]

[tool.ruff.lint.pycodestyle]
# The formatter wraps code at 88; E501 only flags what it cannot wrap (long strings,
# docstrings, comments) beyond 100.
max-line-length = 100

[tool.ruff.lint.per-file-ignores]
# Tests and notebooks may print and use broad patterns.
"tests/**" = ["T20", "BLE", "PTH"]
"notebooks/**" = ["T20", "BLE", "PTH", "E501", "B018", "RET504"]
# Widgets show status by printing into ipywidgets Output areas; CLI scripts print.
"src/omero_annotate_ai/widgets/**" = ["T201"]
".github/scripts/**" = ["T201"]
# legacy, rewritten in 0.5.0 core PRs
"src/omero_annotate_ai/core/annotation_pipeline.py" = ["T20", "BLE", "PTH", "E501", "SIM", "RET", "B"]
"src/omero_annotate_ai/core/annotation_config.py" = ["T20", "BLE", "PTH", "E501", "SIM", "RET", "B"]
"src/omero_annotate_ai/widgets/workflow_widget.py" = ["T20", "BLE", "PTH", "E501", "SIM", "RET", "B"]
"src/omero_annotate_ai/omero/omero_functions.py" = ["T20", "BLE", "PTH", "E501", "SIM", "RET", "B"]

[tool.pyright]
include = ["src/omero_annotate_ai"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportMissingModuleSource = "none"
# legacy, rewritten in 0.5.0 core PRs: analysed for imports, diagnostics not reported.
ignore = [
    "src/omero_annotate_ai/core/annotation_pipeline.py",
    "src/omero_annotate_ai/core/annotation_config.py",
    "src/omero_annotate_ai/widgets/workflow_widget.py",
    "src/omero_annotate_ai/omero/omero_functions.py",
]
# New core modules (0.5.0 core PRs) are checked strictly from their first commit.
strict = [
    "src/omero_annotate_ai/planning.py",
    "src/omero_annotate_ai/annotators.py",
    "src/omero_annotate_ai/bundle.py",
    "src/omero_annotate_ai/errors.py",
    "src/omero_annotate_ai/events.py",
    "src/omero_annotate_ai/session.py",
    "src/omero_annotate_ai/reconcile.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast unit tests with mocked dependencies",
    "omero: needs an OMERO server",
    "integration: integration tests",
    "docker: needs the Docker test OMERO (tests/docker-compose.yml)",
    "slow: takes longer than a few seconds",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::FutureWarning",
]

# Pixi configuration
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]

#[tool.pixi.system-requirements]
#cuda = "12.8"

# Default environment - minimal user installation
[tool.pixi.dependencies]
python = "3.11.*"
micro_sam = ">=1.8,<2"
jupyter = ">=1.1.1,<2"
napari = ">=0.6.2,<0.7"
zeroc-ice = ">=3.6.4,<3.7"
kornia = "<0.7"
ipykernel = ">=6.30.1,<7"
pip = ">=25.2,<26"
numpy = ">=1.21.0"
pytorch = ">=2.7.1,<3"
stackview = ">=0.18.0,<0.19"
hf-xet = "<1.1.9"

# Development feature
[tool.pixi.feature.dev.dependencies]
pytest = ">=8.4.1,<9"
pytest-cov = ">=6.2.1,<7"
pytest-mock = ">=3.14.1,<4"
pre-commit = ">=4.7.0,<5"
ruff = ">=0.17.4,<0.18"
pyright = ">=1.1.414,<2"

# Documentation feature
[tool.pixi.feature.docs.dependencies]
zensical = ">=0.0.73"
mkdocstrings = ">=1.0.8"
mkdocstrings-python = ">=1.18"
griffe-pydantic = ">=1.1.7"

[tool.pixi.feature.dev.pypi-dependencies]
build = "*"
twine = "*"

# MIFA export feature (optional) - BioImage Archive annotation metadata models.
# Git-only package (not on PyPI); pinned to a release tag so poetry-dynamic-versioning
# can resolve a version. Imported lazily by omero_annotate_ai.core.mifa_export, so the
# default user environment stays lean and only dev / the `mifa` env pull it in.
[tool.pixi.feature.mifa.pypi-dependencies]
bia-mifa-models = { git = "https://github.com/BioImage-Archive/bia-mifa-models.git", tag = "v1.1.5" }

# OME-Zarr reading (optional) - ome-zarr-py, imported lazily by sources/zarr.py.
[tool.pixi.feature.zarr.dependencies]
ome-zarr = ">=0.16"

# Environment definitions
[tool.pixi.environments]
default = ["all", "zarr"]
dev = ["dev", "all", "mifa", "zarr"]
docs = ["docs"]
dev-docs = ["dev", "docs"]
mifa = ["mifa"]

[tool.pixi.pypi-dependencies]
omero-annotate-ai = { path = ".", editable = true }

[tool.pixi.tasks]
# Testing
test = {cmd = "pytest tests/ -v"}
test-unit = {cmd = "pytest tests/ -v -m \"not (omero or integration or docker)\""}
test-cov = { cmd = "pytest tests/ --cov=omero_annotate_ai --cov-report=xml" }

# Git hooks: strip notebook outputs on commit (run once per clone)
install-hooks = { cmd = "pre-commit install" }

# Code quality
lint = { cmd = "ruff check . && ruff format --check ." }
format = { cmd = "ruff check --fix . && ruff format ." }
typecheck = { cmd = "pyright" }

# Documentation
docs-serve = {cmd = "zensical serve"}
docs-build = {cmd = "zensical build --clean"}

# Development
start-omero = {cmd = "docker compose -p oai-test -f tests/docker-compose.yml up -d --wait"}
stop-omero = {cmd = "docker compose -p oai-test -f tests/docker-compose.yml down -v"}
test-omero = {cmd = "pytest tests/ -m docker -v --no-cov"}
build = { cmd = "python -m build" }
clean = {cmd = "rm -rf build/ dist/ *.egg-info/ && find . -type d -name __pycache__ -exec rm -rf {} + && find . -type f -name \"*.pyc\" -delete"}

# Publishing tasks
check-package = { cmd = "python -m twine check dist/*" }
upload-test = { cmd = "python -m twine upload --repository testpypi dist/*" }
upload-prod = { cmd = "python -m twine upload dist/*" }
verify-build = { cmd = "python -m zipfile -l dist/*.whl && tar -tzf dist/*.tar.gz" }

