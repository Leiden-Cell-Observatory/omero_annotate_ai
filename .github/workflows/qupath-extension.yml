name: QuPath extension

on:
  push:
    branches: [ main, develop ]
    paths: [ "qupath-extension/**", ".github/workflows/qupath-extension.yml" ]
  pull_request:
    paths: [ "qupath-extension/**", ".github/workflows/qupath-extension.yml" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: qupath-extension
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - uses: gradle/actions/setup-gradle@v5

    - name: Build and test
      run: ./gradlew build

    - uses: actions/upload-artifact@v7
      with:
        name: qupath-extension-omero-annotate-ai
        path: qupath-extension/build/libs/qupath-extension-omero-annotate-ai-*[0-9].jar
        if-no-files-found: error
