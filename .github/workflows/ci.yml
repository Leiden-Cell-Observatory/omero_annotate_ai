name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Notebooks have no outputs
      run: python3 .github/scripts/check_notebook_outputs.py

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        pixi-version: v0.72.2
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true
        environments: dev

    - name: Ruff (lint + format)
      run: pixi run -e dev lint

    - name: Pyright
      run: pixi run -e dev typecheck

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - uses: actions/checkout@v7
    
    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        pixi-version: v0.72.2
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true
        environments: dev
        
    - name: Run unit tests
      run: pixi run -e dev test-unit
      
    - name: Start test OMERO (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: pixi run start-omero

    - name: Integration tests against OMERO (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: pixi run -e dev test-omero

    - name: Stop test OMERO
      if: always() && matrix.os == 'ubuntu-latest'
      run: pixi run stop-omero

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Install pixi
      uses: prefix-dev/setup-pixi@v0.11.2
      with:
        pixi-version: v0.72.2
        cache: true
        cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        locked: true
        environments: dev
        
    - name: Build package
      run: pixi run -e dev build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: release
    permissions:
      id-token: write  # For trusted publishing
      
    steps:
    - uses: actions/checkout@v7
    
    - name: Download build artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/
    
    - name: Verify package contents
      run: |
        echo "Package contents:"
        ls -la dist/
        python -m zipfile -l dist/*.whl || echo "No wheel found"
        tar -tzf dist/*.tar.gz || echo "No tarball found"
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        verbose: true